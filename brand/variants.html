<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#050607;color:#9AA4AE;font:14px "DejaVu Sans",sans-serif;padding:28px}
.row{display:flex;gap:40px;align-items:flex-end;margin-bottom:34px}
.card{display:flex;flex-direction:column;align-items:center;gap:8px}
h2{color:#E8EDF2;font-weight:600;font-size:18px;margin:0 0 14px}
.word{display:flex;align-items:center;gap:18px;background:#0B0D10;border:1px solid #1F252D;border-radius:16px;padding:16px 26px}
.word b{color:#E8EDF2;font:700 46px "DejaVu Sans",sans-serif;letter-spacing:7px}
.word i{color:#2EE6A6;font-style:normal}
.tab{display:flex;align-items:center;gap:8px;background:#1b1f24;color:#cfd6dd;border-radius:8px 8px 0 0;padding:8px 14px;font-size:13px}
</style></head><body>
<h2>A. Arch bridge + data stream</h2>
<div class="row">
 <div class="card"><img src="ark-mark.svg" width="200"><span>app icon</span></div>
 <div class="card"><img src="ark-mark.svg" width="64"><span>64</span></div>
 <div class="card"><img src="ark-mark.svg" width="32"><span>32</span></div>
 <div class="card"><img src="ark-mark.svg" width="16"><span>16</span></div>
 <div class="card"><div class="tab"><img src="ark-mark.svg" width="16">ARK Console</div><span>browser tab</span></div>
 <div class="card"><div class="word"><img src="ark-mark.svg" width="60"><b>AR<i>K</i></b></div><span>lockup</span></div>
</div>
<h2>C. Letter A, crossbar is data flowing through</h2>
<div class="row">
 <div class="card"><img src="ark-mark-c.svg" width="200"><span>app icon</span></div>
 <div class="card"><img src="ark-mark-c.svg" width="64"><span>64</span></div>
 <div class="card"><img src="ark-mark-c.svg" width="32"><span>32</span></div>
 <div class="card"><img src="ark-mark-c.svg" width="16"><span>16</span></div>
 <div class="card"><div class="tab"><img src="ark-mark-c.svg" width="16">ARK Console</div><span>browser tab</span></div>
 <div class="card"><div class="word"><img src="ark-mark-c.svg" width="60"><b>ARK</b></div><span>lockup</span></div>
</div>
</body></html>
